<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Cuphead</title>
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #gameContainer {
        width: 100vw !important;
        height: 100vh !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
      /* Écran de chargement rétro (même style que le portfolio) */
      #gl { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #07020f; color: #fff; font-family: "Press Start 2P", monospace; }
      #gl-title { font-size: clamp(14px, 3vw, 26px); letter-spacing: 2px; text-align: center; padding: 0 16px; text-shadow: 3px 0 #ff2fa0, -3px 0 #2ff3ff, 0 0 14px #ff5fc1; }
      #gl-track { width: min(420px, 80vw); height: 22px; padding: 3px; border: 3px solid #fff; box-shadow: 0 0 14px rgba(255, 95, 193, .6); }
      #gl-fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, #ff5fc1 0 10px, transparent 10px 13px); transition: width .2s; }
      #gl-info { font-size: 11px; line-height: 1.8; color: #ffd36e; text-align: center; }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  </head>
  <body>
    <div id="gl"><div id="gl-title">CUPHEAD</div><div id="gl-track"><div id="gl-fill"></div></div><div id="gl-info">0%</div></div>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
    var gl = document.querySelector("#gl");
    var glFill = document.querySelector("#gl-fill");
    var glInfo = document.querySelector("#gl-info");
    const TOTAL_MB = 2101.31;
    let loadedBytes = 0;
    let glPending = false;
    function showDownload() {
      if (glPending) return;
      glPending = true;
      requestAnimationFrame(() => {
        glPending = false;
        const mb = loadedBytes / (1024 * 1024);
        const pct = Math.min(mb / TOTAL_MB, 1) * 100;
        glFill.style.width = pct + "%";
        glInfo.innerHTML = `${Math.round(pct)}%<br>${mb.toFixed(0)} / ${TOTAL_MB.toFixed(0)} MB`;
      });
    }

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        loadedBytes += value.length;
        chunks.push(value);
        showDownload();
      }
      // Blob direct : plus de copie complète du fichier en RAM
      return new Blob(chunks);
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("cuphead-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const blobs = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(blobs);
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl, asmUrl] = await Promise.all([
        mergeFiles(getParts("Build/CupheadPort.data.unityweb", 1, 103), "CupheadPort.data.unityweb"),
        mergeFiles(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2), "CupheadPort.wasm.code.unityweb"),
        mergeFiles(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3), "CupheadPort.asm.code.unityweb"),
      ]);

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (url.includes("CupheadPort.data.unityweb")) {
              url = dataUrl;
          } else if (url.includes("CupheadPort.wasm.code.unityweb")) {
              url = wasmUrl;
          } else if (url.includes("CupheadPort.asm.code.unityweb")) {
              url = asmUrl;
          }
          return originalOpen.call(this, method, url, ...rest);
      };
      var unityInstance = UnityLoader.instantiate("gameContainer", "Build/CupheadPort.json");
      gl.remove();
    })();
    </script>
  </body>
</html>

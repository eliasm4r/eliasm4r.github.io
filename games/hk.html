                                        <!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight@1b7d1e452f66268486e9a000a6006b4e8eb527bc/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Hollow Knight</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Écran de chargement rétro (même style que le portfolio) */
        #gl { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #07020f; color: #fff; font-family: "Press Start 2P", monospace; }
        #gl-title { font-size: clamp(14px, 3vw, 26px); letter-spacing: 2px; text-align: center; padding: 0 16px; text-shadow: 3px 0 #ff2fa0, -3px 0 #2ff3ff, 0 0 14px #ff5fc1; }
        #gl-track { width: min(420px, 80vw); height: 22px; padding: 3px; border: 3px solid #fff; box-shadow: 0 0 14px rgba(255, 95, 193, .6); }
        #gl-fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, #ff5fc1 0 10px, transparent 10px 13px); transition: width .2s; }
        #gl-info { font-size: 11px; line-height: 1.8; color: #ffd36e; text-align: center; }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
</head>

<body>
    <div id="gl"><div id="gl-title">HOLLOW KNIGHT</div><div id="gl-track"><div id="gl-fill"></div></div><div id="gl-info">0%</div></div>
    <div hidden id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-mobile-warning"> WebGL builds are not supported on mobile devices. </div>
    </div>
    <script>
        var gl = document.querySelector("#gl");
        var glFill = document.querySelector("#gl-fill");
        var glInfo = document.querySelector("#gl-info");
        function glSet(pct, text) {
            glFill.style.width = pct + "%";
            glInfo.innerHTML = text;
        }
        const TOTAL_MB = 860.36;
        let loadedBytes = 0;
        let glPending = false;
        let downloading = true;
        // Le téléchargement compte pour 0-90 %, le démarrage Unity pour 90-100 %
        function showDownload() {
            if (glPending) return;
            glPending = true;
            requestAnimationFrame(() => {
                glPending = false;
                if (!downloading) return; // ne pas écraser le texte "DÉMARRAGE..."
                const mb = loadedBytes / (1024 * 1024);
                const pct = Math.min(mb / TOTAL_MB, 1) * 90;
                glSet(pct, `${Math.round(pct / 0.9)}%<br>${mb.toFixed(0)} / ${TOTAL_MB.toFixed(0)} MB`);
            });
        }
        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                loadedBytes += value.length;
                chunks.push(value);
                showDownload();
            }
            // Blob direct : plus de copie complète du fichier en RAM
            return new Blob(chunks);
        }
        async function mergeFiles(fileParts) {
            const blobs = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
            return URL.createObjectURL(new Blob(blobs));
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        (async () => {
            const [dataUrl, wasmurl] = await Promise.all([
                mergeFiles(getParts("Build/hk.data", 1, 42)),
                mergeFiles(getParts("Build/hk.wasm", 1, 2)),
            ]);
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/hk.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/hk.framework.js",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Team Cherry & Truffled",
                productName: "Hollow Knight",
                productVersion: "1.0",
            };
            var container = document.querySelector("#unity-container");
            container.hidden = false;
            var canvas = document.querySelector("#unity-canvas");
            var loadingBar = document.querySelector("#unity-loading-bar");
            var progressBarFull = document.querySelector("#unity-progress-bar-full");
            var fullscreenButton = document.querySelector("#unity-fullscreen-button");
            var mobileWarning = document.querySelector("#unity-mobile-warning");
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
                mobileWarning.style.display = "block";
                setTimeout(() => {
                    mobileWarning.style.display = "none";
                }, 5000);
            } else {
              if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                var meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                document.getElementsByTagName('head')[0].appendChild(meta);
                container.className = "unity-mobile";
                canvas.className = "unity-mobile";
            } else {
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }
            }
            downloading = false;
            glSet(90, "DÉMARRAGE...");
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    glSet(90 + 10 * progress, "DÉMARRAGE... " + Math.round(100 * progress) + "%");
                }).then((unityInstance) => {
                  gl.remove();
                    loadingBar.style.display = "none";
                    canvas.style.display = "block";
                }).catch((message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        })();
    </script>
</body>

</html>

<!DOCTYPE html>


<!-- Ultimate Game Stash file--> 
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


  <head>
    <script>
      window.gameconfig = {
        name: "Plants vs. Zombies (U)",
        url: "https://cdn.jsdelivr.net/gh/greeniYT/ROM-s@main/pvz/5495%20-%20Plants%20vs.%20Zombies%20(U).nds",
        core: "nds",
        min: 1,
        max: 4
      };
    </script>
    <script>
      // Tous les morceaux sont téléchargés en parallèle (avant : un par un)
      function mergeFiles(fileParts, cb) {
        let loaded = 0;
        return Promise.all(
          fileParts.map((url) =>
            fetch(url)
              .then((response) => response.blob())
              .then((blob) => {
                cb(++loaded);
                return blob;
              })
          )
        ).then((blobs) => URL.createObjectURL(new Blob(blobs)));
      }
      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          let padded = String(i).padStart((end+"").length, '0');
          parts.push(file + ".part" + padded);
        }
        return parts;
      }
    </script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }
      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }
      /* Écran de chargement rétro (même style que le portfolio) */
      #gl { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #07020f; color: #fff; font-family: "Press Start 2P", monospace; }
      #gl-title { font-size: clamp(14px, 3vw, 26px); letter-spacing: 2px; text-align: center; padding: 0 16px; text-shadow: 3px 0 #ff2fa0, -3px 0 #2ff3ff, 0 0 14px #ff5fc1; }
      #gl-track { width: min(420px, 80vw); height: 22px; padding: 3px; border: 3px solid #fff; box-shadow: 0 0 14px rgba(255, 95, 193, .6); }
      #gl-fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, #ff5fc1 0 10px, transparent 10px 13px); transition: width .2s; }
      #gl-info { font-size: 11px; line-height: 1.8; color: #ffd36e; text-align: center; }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  </head>
  <body>
    <div id="game-container">
      <div id="game"></div>
      <div id="gl"><div id="gl-title">PLANTS VS. ZOMBIES</div><div id="gl-track"><div id="gl-fill"></div></div><div id="gl-info">0%<br>Le premier chargement peut être plus long</div></div>
    </div>
    <script>
      // version anglaise du site (même réglage que la page principale)
      let EN_UI = false;
      try { EN_UI = localStorage.getItem("eliasPortfolio.lang") === "en"; } catch (e) { }
      if (EN_UI) document.getElementById("gl-info").innerHTML = "0%<br>The first load may take longer";

      var parts = getParts(
        window.gameconfig.url,
        window.gameconfig.min,
        window.gameconfig.max
      );
      var totalParts = parts.length;

      function updateLoadingProgress(loaded) {
        const pct = Math.round((loaded / totalParts) * 100);
        document.getElementById("gl-fill").style.width = pct + "%";
        document.getElementById("gl-info").textContent = pct + "%";
      }

      Promise.all([mergeFiles(parts, updateLoadingProgress)])
        .then(([gameUrl]) => {
          document.getElementById("gl").remove();
          EJS_player = "#game";
          EJS_core = window.gameconfig.core;
          EJS_gameName = window.gameconfig.name;
          EJS_color = "#0064ff";
          EJS_startOnLoaded = true;
          EJS_pathtodata = "https://cdn.jsdelivr.net/gh/bubblfan/emu@7bf5cbb0b94866568d2aaa1fd42ebb5acd517e0d/";
          EJS_gameUrl = gameUrl;
          const script = document.createElement("script");
          script.src =
            "https://cdn.jsdelivr.net/gh/bubblfan/emu@7bf5cbb0b94866568d2aaa1fd42ebb5acd517e0d/loader.js";
          document.body.appendChild(script);
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("gl-info").textContent =
            (EN_UI ? "Couldn't load the game." : "Erreur de chargement du jeu.");
        });
    </script>
  </body>
</html>

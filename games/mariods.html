<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Super Mario Bros. DS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        #game { width: 100%; height: 100%; display: none; }
        #startButton {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 160px; height: 50px;
            background: #e52525;
            color: #fff;
            font-size: 16px;
            border: none; border-radius: 8px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 0 0 12px rgba(229,37,37,0.6);
        }
        #startButton:hover { background: #ff3c3c; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game"></div>
    <button id="startButton">▶ PLAY</button>

    <script>
        document.getElementById('startButton').addEventListener('click', function () {
            this.style.display = 'none';
            document.getElementById('game').style.display = 'block';

            EJS_player = '#game';
            EJS_core = 'nds';
            EJS_color = '#e52525';
            EJS_startOnLoaded = true;
            EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/';
            EJS_gameUrl = 'https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@3dc79d9addc4c73eaa5850f556c15826028f7b10/New%20Super%20Mario%20Bros.%20(USA%2C%20Australia).zip';

            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>

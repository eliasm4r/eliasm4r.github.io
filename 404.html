<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Game Over — Elias Maruca</title>
    <link rel="icon" href="/assets/logo-site.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            padding: 16px;
            text-align: center;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #28000a 0%, #000 70%);
            color: #fff;
            font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        }

        /* braises qui montent */
        .ember {
            position: fixed;
            bottom: -10px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #ff5a6e;
            box-shadow: 0 0 8px #ff5a6e;
            animation: rise linear infinite;
            opacity: 0;
        }

        @keyframes rise {
            10% { opacity: 0.9; }
            to { transform: translate(var(--dx), -105vh); opacity: 0; }
        }

        h1 {
            font-family: "Cinzel", "Times New Roman", serif;
            font-size: clamp(48px, 12vw, 140px);
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #c8102e;
            text-shadow: 0 0 30px rgba(200, 16, 46, 0.6), 0 6px 0 #3a0008;
            animation: title 1.6s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes title {
            from { opacity: 0; transform: translateY(-30px) scale(1.15); filter: blur(12px); letter-spacing: 0.4em; }
        }

        .code {
            margin-top: 8px;
            font-size: 13px;
            letter-spacing: 0.4em;
            color: #8a5560;
        }

        .sub {
            margin-top: 18px;
            font-size: 16px;
            color: #d9a3a9;
            animation: up .6s ease-out .9s both;
        }

        .q {
            margin-top: 48px;
            font-family: "Cinzel", serif;
            font-size: 26px;
            animation: up .6s ease-out 1.2s both;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 18px;
            animation: up .6s ease-out 1.4s both;
        }

        .choices a,
        .choices button {
            position: relative;
            padding: 8px 16px 8px 30px;
            border: none;
            background: none;
            font: 700 18px "JetBrains Mono", monospace;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            color: #a8949a;
            cursor: pointer;
        }

        .choices a::before,
        .choices button::before {
            content: "▶";
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #ff5a6e;
            opacity: 0;
        }

        .choices a:hover,
        .choices a:focus-visible,
        .choices button:hover,
        .choices button:focus-visible {
            color: #fff;
            outline: none;
        }

        .choices a:hover::before,
        .choices a:focus-visible::before,
        .choices button:hover::before,
        .choices button:focus-visible::before {
            opacity: 1;
        }

        .reply {
            min-height: 20px;
            margin-top: 16px;
            font-size: 13px;
            color: #ff5a6e;
        }

        @keyframes up {
            from { opacity: 0; transform: translateY(8px); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before { animation: none !important; }
        }
    </style>
</head>

<body>
    <main>
        <h1>GAME OVER</h1>
        <p class="code">ERREUR 404</p>
        <p class="sub">Cette zone n'existe pas. Vous vous êtes aventuré trop loin.</p>
        <p class="q">Continuer ?</p>
        <div class="choices">
            <a href="/" id="yes">Oui</a>
            <button type="button" id="no">Non</button>
        </div>
        <p class="reply" id="reply" aria-live="polite"></p>
    </main>

    <script>
        // "Non" n'est pas vraiment une option : on renvoie quand même au site
        document.getElementById('no').addEventListener('click', () => {
            document.getElementById('reply').textContent = en ? 'Fate decided otherwise...' : 'Le destin en a décidé autrement...';
            setTimeout(() => { window.location.href = '/'; }, 1600);
        });
        // version anglaise (choisie dans le menu du site)
        let en = false;
        try { en = localStorage.getItem('eliasPortfolio.lang') === 'en'; } catch { }
        if (en) {
            document.documentElement.lang = 'en';
            document.querySelector('.code').textContent = 'ERROR 404';
            document.querySelector('.sub').textContent = "This zone doesn't exist. You wandered too far.";
            document.querySelector('.q').textContent = 'Continue?';
            document.getElementById('yes').textContent = 'Yes';
            document.getElementById('no').textContent = 'No';
        }
        document.getElementById('yes').focus();
        for (let i = 0; i < 24; i++) {
            const e = document.createElement('span');
            e.className = 'ember';
            e.style.left = Math.random() * 100 + '%';
            e.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
            e.style.animationDuration = (5 + Math.random() * 6) + 's';
            e.style.animationDelay = (Math.random() * 6) + 's';
            document.body.appendChild(e);
        }
    </script>
</body>

</html>
